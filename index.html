<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>AR Brief</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
}

a-scene {
  width: 100vw;
  height: 100vh;
}

#startOverlay {
  position: fixed;
  inset: 0;
  z-index: 999999;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  pointer-events: none;
}

#startButton {
  pointer-events: auto;
  width: 85vw;
  max-width: 430px;
  min-height: 105px;
  border: none;
  border-radius: 34px;
  padding: 25px 35px;
  font-size: 34px;
  font-weight: 800;
  letter-spacing: 0.5px;
  color: white;
  background: linear-gradient(135deg, #00c853 0%, #43a047 40%, #ff9800 100%);
  box-shadow:
    0 25px 60px rgba(0,0,0,0.45),
    0 10px 30px rgba(255,152,0,0.35);
  text-align: center;
}

#startButton:active {
  transform: scale(0.96);
}

#subtitle {
  margin-top: 22px;
  width: 90vw;
  color: white;
  font-size: 18px;
  text-align: center;
  text-shadow: 0 2px 8px rgba(0,0,0,.6);
}
</style>
</head>

<body>

<div id="startOverlay">
  <button id="startButton">✨ AR ERLEBEN</button>
  <div id="subtitle">Richte danach die Kamera auf den Brief</div>
</div>

<a-scene
  mindar-image="imageTargetSrc: ./brief.mind;"
  embedded
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights: true; alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: true">

  <a-assets>
    <video
      id="arvideo"
      src="./video.mp4"
      muted
      autoplay
      loop
      preload="auto"
      playsinline
      webkit-playsinline>
    </video>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">
    <a-video
      src="#arvideo"
      width="1"
      height="1.4"
      position="0 0 0.05"
      material="transparent: true; opacity: 1;">
    </a-video>
  </a-entity>

</a-scene>

<script>
const startOverlay = document.getElementById("startOverlay");
const video = document.getElementById("arvideo");
const target = document.querySelector("[mindar-image-target]");

document.getElementById("startButton").addEventListener("click", async () => {
  try {
    await video.play();
    video.pause();
    startOverlay.style.display = "none";
  } catch (e) {
    console.log(e);
  }
});

target.addEventListener("targetFound", async () => {
  try {
    video.currentTime = 0;
    await video.play();
  } catch (e) {
    console.log(e);
  }
});

target.addEventListener("targetLost", () => {
  video.pause();
});
</script>

</body>
</html>
