<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>AR Brief</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    a-scene {
      width: 100vw;
      height: 100vh;
    }

    #startButton {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      z-index: 999999;

      width: 85vw;
      max-width: 430px;
      min-height: 100px;

      border: none;
      border-radius: 32px;

      padding: 25px 35px;

      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.5px;

      color: white;

      background: linear-gradient(
        135deg,
        #00c853 0%,
        #43a047 40%,
        #ff9800 100%
      );

      box-shadow:
        0 25px 60px rgba(0,0,0,0.45),
        0 10px 30px rgba(255,152,0,0.35);

      cursor: pointer;
      transition: all .25s ease;
    }

    #startButton:active {
      transform: translate(-50%, -50%) scale(0.96);
    }
  </style>
</head>

<body>

<button id="startButton">
✨ AR ERLEBEN
</button>

<a-scene
  mindar-image="imageTargetSrc: ./brief.mind; filterMinCF: 0.0001; filterBeta: 0.001;"
  embedded
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true; antialias: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: true">

  <a-assets>

    <video
      id="arvideo"
      src="./video.mp4"
      muted
      autoplay
      loop
      preload="auto"
      playsinline
      webkit-playsinline
      crossorigin="anonymous">
    </video>

  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-video
      src="#arvideo"
      width="0.9"
      height="1.25"
      position="0 0 0.02"
      material="shader: flat; transparent: true; opacity: 1; side: double; toneMapped: false;">
    </a-video>

  </a-entity>

</a-scene>

<script>
  const startButton = document.getElementById("startButton");
  const video = document.getElementById("arvideo");
  const target = document.querySelector("[mindar-image-target]");

  startButton.addEventListener("click", async () => {
    try {
      video.muted = true;
      video.playsInline = true;
      await video.play();
      video.pause();
      startButton.style.display = "none";
    } catch (e) {
      console.log(e);
    }
  });

  target.addEventListener("targetFound", async () => {
    try {
      video.currentTime = 0;
      await video.play();
      console.log("Video gestartet");
    } catch (e) {
      console.log(e);
    }
  });

  target.addEventListener("targetLost", () => {
    video.pause();
  });
</script>

</body>
</html>
